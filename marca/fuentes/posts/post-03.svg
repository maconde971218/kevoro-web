<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc"><title id="title">Tu idea merece una herramienta propia.</title><desc id="desc">Propuesta de post sobre desarrollo a la medida. Tres piezas originales representan idea, interfaz y Kevoro. Invitación a conversar por el correo de Kevoro.</desc><rect width="1080" height="1350" fill="#DCEAF7"/><g font-family="Manrope,Arial,sans-serif"><text x="80" y="115" fill="#183B35" font-size="36" font-weight="600">Desarrollo a la medida</text><g transform="translate(74 195)"><rect x="0" y="0" width="270" height="210" rx="28" fill="#164D43"/><path d="M80 105h110M135 50v110" stroke="#D9FA79" stroke-width="15" stroke-linecap="round"/><rect x="302" y="0" width="302" height="210" rx="28" fill="#D9FA79"/><rect x="382" y="57" width="142" height="96" rx="12" fill="none" stroke="#164D43" stroke-width="13"/><rect x="636" y="0" width="296" height="210" rx="28" fill="#FAFCF9"/><g transform="translate(720 47) scale(1.25)" fill="#164D43"><rect x="12" y="12" width="22" height="76" rx="6"/><path d="M44 45 70 14a6 6 0 0 1 5-2h15L59 49Z"/><path d="m44 55 15-4 31 37H75a6 6 0 0 1-5-2Z"/></g></g><text x="80" y="562" fill="#183B35" font-size="83" font-weight="800" letter-spacing="-4"><tspan x="80">Tu idea merece</tspan><tspan x="80" dy="98">una herramienta</tspan><tspan x="80" dy="98">propia.</tspan></text><text x="80" y="902" fill="#183B35" font-size="34" font-weight="500"><tspan x="80">Cuéntanos qué necesita</tspan><tspan x="80" dy="48">tu negocio.</tspan></text><rect x="80" y="1044" width="436" height="100" rx="50" fill="#164D43"/><text x="124" y="1107" fill="#FAFCF9" font-size="43" font-weight="700">Conversemos.</text><g transform="translate(80 1214) scale(.5)" fill="#164D43"><rect x="12" y="12" width="22" height="76" rx="6"/><path d="M44 45 70 14a6 6 0 0 1 5-2h15L59 49Z"/><path d="m44 55 15-4 31 37H75a6 6 0 0 1-5-2Z"/></g><text x="150" y="1255" fill="#164D43" font-size=