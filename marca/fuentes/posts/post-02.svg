<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc"><title id="title">Tu agenda, con todo en su lugar.</title><desc id="desc">Propuesta de post sobre Basilia Connect. Una agenda esquemática contiene bloques de mañana y tarde, sin nombres ni datos de pacientes; está rotulada Ilustración conceptual.</desc><rect width="1080" height="1350" fill="#FAFCF9"/><g font-family="Manrope,Arial,sans-serif"><g transform="translate(80 58) scale(.5)" fill="#164D43"><rect x="12" y="12" width="22" height="76" rx="6"/><path d="M44 45 70 14a6 6 0 0 1 5-2h15L59 49Z"/><path d="m44 55 15-4 31 37H75a6 6 0 0 1-5-2Z"/></g><text x="150" y="99" fill="#164D43" font-size="40" font-weight="800" letter-spacing="-2">kevoro</text><rect x="79" y="163" width="280" height="54" rx="27" fill="#D9FA79"/><text x="105" y="201" fill="#183B35" font-size="28" font-weight="700">Basilia Connect</text><text x="80" y="325" fill="#183B35" font-size="83" font-weight="800" letter-spacing="-4"><tspan x="80">Tu agenda,</tspan><tspan x="80" dy="96">con todo</tspan><tspan x="80" dy="96">en su lugar.</tspan></text><rect x="78" y="598" width="924" height="448" rx="28" fill="#DCEAF7"/><text x="126" y="669" fill="#183B35" font-size="28" font-weight="700">Agenda de ejemplo</text><path d="M126 699H954" stroke="#ABC5D0" stroke-width="2"/><rect x="126" y="737" width="86" height="70" rx="15" fill="#FAFCF9"/><path d="M151 772h36M169 754v36" stroke="#164D43" stroke-width="5" stroke-linecap="round"/><rect x="240" y="737" width="714" height="70" rx="15" fill="#FAFCF9"/><text x="271" y="781" fill="#183B35" font-size="27" font-weight="600">Bloque de mañana</text><rect x="126" y="833" width="86" height="70" rx="15" fill="#FAFCF9"/><path d="M151 868h36M169 850v36" stroke="#164D43" stroke-width="5" stroke-linecap="round"/><rect x="240" y="833" width="714" height="70" rx="15" fill="#FAFCF9"/><text x="271" y="877" fill="#183B35" font-size="27" font-weight="600">Bloque de tarde</text><text x="126" y="994" fill="#40605D" font-size="24">Ilustración conceptual</text><text x="80" y="1150" fill="#183B35" font-size="32" font-weight="500"><tspan x="80">Una agenda de trabajo</tspan><tspan x="80" dy="45">pensada para clínicas.</tspan></text><text x="80" y="1280" fill="#164D43" font-size="29" font-weight="700">Solicita una demo.</text></g></svg>
