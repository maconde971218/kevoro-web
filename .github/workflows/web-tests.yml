name: Test Kevoro web

on:
  pull_request:
  push:
    branches:
      - feat/marca-y-web

permissions:
  contents: read

jobs:
  desktop-and-mobile:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install test dependencies and Chromium
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
      - name: Test deterministic contact and local server logic
        shell: bash
        run: |
          mkdir -p test-results
          npm ci
          set -o pipefail
          npm test 2>&1 | tee test-results/node-tests.log
      - name: Test desktop, mobile and narrow mobile
        shell: bash
        run: |
          mkdir -p test-results
          python .agents/skills/webapp-testing/scripts/with_server.py --help
          set -o pipefail
          python .agents/skills/webapp-testing/scripts/with_server.py \
            --server "exec node scripts/preview.mjs --port 8765" --port 8765 \
            -- python -m unittest discover -s tests -v 2>&1 | tee test-results/unittest.log
      - name: Package local preview without publishing
        if: always()
        run: python tests/package_preview.py test-results/kevoro-preview.zip
      - name: Upload downloadable local preview
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kevoro-local-preview
          path: test-results/kevoro-preview.zip
          if-no-files-found: warn
          retention-days: 7
      - name: Upload screenshots, traces and test output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kevoro-web-test-results
          path: |
            test-results/
            !test-results/kevoro-preview.zip
          if-no-files-found: warn
          retention-days: 7
